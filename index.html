
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffb6d5">
  <title>Love Surprise 💖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #8e2456;
      background: linear-gradient(
        135deg, #ffe0ef, #ffc3df, #e8d5ff, #fff0f5
      );
      background-size: 300% 300%;
      animation: gradientMove 12s ease infinite;
    }

    @keyframes gradientMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -60px;
      animation: floatUp linear forwards;
      opacity: 0;
      user-select: none;
      filter: drop-shadow(0 4px 8px #e94b8c30);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(.6);
        opacity: 0;
      }
      10% { opacity: .85; }
      85% { opacity: .7; }
      100% {
        transform: translateY(-115vh) rotate(35deg) scale(1.3);
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 34px 25px;
      text-align: center;
      border: 1px solid #ffffffb8;
      border-radius: 30px;
      background: #ffffffa8;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 55px #b94b8230;
      animation: appear 1s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(25px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .main-heart {
      font-size: 76px;
      display: inline-block;
      animation: heartbeat 1.4s ease-in-out infinite;
      filter: drop-shadow(0 7px 12px #e83e7c40);
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    .small-label {
      margin: 18px 0 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: bold;
      color: #c34d83;
    }

    h1 {
      margin: 8px 0 14px;
      font-size: clamp(29px, 7vw, 43px);
      line-height: 1.2;
      color: #c52d70;
    }

    .message {
      max-width: 350px;
      margin: 0 auto;
      font-size: 16px;
      line-height: 1.8;
      color: #75435e;
    }

    .divider {
      margin: 24px auto;
      color: #df6c9e;
      letter-spacing: 8px;
    }

    .question {
      font-size: 21px;
      line-height: 1.5;
      font-weight: bold;
      margin: 20px 0;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      border: none;
      padding: 14px 25px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      transform: translateY(-3px);
    }

    button:focus-visible {
      outline: 3px solid #9b3975;
      outline-offset: 4px;
    }

    .yes {
      color: white;
      background: linear-gradient(135deg, #ff5795, #d63384);
      box-shadow: 0 8px 22px #d6338440;
    }

    .yes:hover {
      box-shadow: 0 12px 28px #d6338460;
    }

    .no {
      color: #b12e6c;
      background: #fff;
      box-shadow: 0 5px 15px #a53a6b18;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px 14px;
      border-radius: 20px;
      background: #fff4f9;
      animation: appear .5s ease both;
    }

    .result h2 {
      margin: 0 0 10px;
      color: #d63384;
    }

    .result p {
      line-height: 1.7;
      margin-bottom: 0;
    }

    .footer {
      margin-top: 26px;
      font-size: 12px;
      color: #a65c7e;
    }

    @media (max-width: 380px) {
      .card { padding: 28px 17px; }
      .message { font-size: 15px; }
      .question { font-size: 19px; }
      button { padding: 13px 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
   .creator-credit {   margin-top: 24px;   padding: 12px;   text-align: center;   font-size: 14px;   color: #a65c7e;   letter-spacing: 0.5px; }  .creator-credit strong {   color: #d63384;   font-weight: bold; }
</head>

<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="page">
    <section class="card">
      <div class="main-heart" aria-hidden="true">💖</div>

      <p class="small-label">A little surprise for you</p>

      <h1>Hey, My Special One! 💕</h1>

      <p class="message">
        Tumhari smile mere din ko special bana deti hai.
        Tumse baat karke dil khush ho jata hai.
        Aaj tumhare liye ek chhota sa sawaal hai...
      </p>

      <div class="divider" aria-hidden="true">♥ ♥ ♥</div>

      <p class="question">
        Will you make my world more beautiful? 🥹💗
      </p>

      <div class="buttons" id="buttons">
        <button class="yes" id="yesBtn" type="button">
          Yes 💖
        </button>
        <button class="no" id="noBtn" type="button">
          No 🙈
        </button>
      </div>

      <div class="result" id="result" role="status" aria-live="polite">
        <h2>Yayyy! 🥰💞</h2>
        <p>
          You just made this moment magical! 💖
          Sending you the biggest virtual hug and
          a thousand little hearts. 🫂💕
        </p>
      </div>

      <p class="footer"> <p class="footer">Made with lots of love 💗</p> <footer class="creator-credit">   Created with love by <strong>Ashu</strong> 💖 </footer> 💗</p>
    </section>
  </main>

  <script>
    const heartBox = document.getElementById("hearts");
    const heartTypes = ["💗", "💕", "💖", "💘", "❤️", "💞", "♡"];

    // Create gentle floating hearts.
    function createHeart() {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent =
        heartTypes[Math.floor(Math.random() * heartTypes.length)];

      heart.style.left = Math.random() * 100 + "%";
      heart.style.fontSize = (16 + Math.random() * 25) + "px";
      heart.style.animationDuration = (7 + Math.random() * 7) + "s";

      heartBox.appendChild(heart);

      heart.addEventListener("animationend", () => heart.remove());
    }

    // Keep the animation lightweight.
    for (let i = 0; i < 14; i++) {
      setTimeout(createHeart, i * 350);
    }

    setInterval(() => {
      if (heartBox.childElementCount < 24) createHeart();
    }, 650);

    // Yes button: show the special message and a burst of hearts.
    document.getElementById("yesBtn").addEventListener("click", () => {
      document.getElementById("result").style.display = "block";
      document.getElementById("buttons").style.display = "none";

      for (let i = 0; i < 18; i++) {
        setTimeout(createHeart, i * 90);
      }
    });

    // A playful No button that moves to a nearby position.
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("click", () => {
      const x = Math.round(Math.random() * 100 - 50);
      const y = Math.round(Math.random() * 60 - 30);
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
